name: gradient-block-boundary-replication
on:
  push:
    branches: ['experiment/boundary-kv-bonsai']
    paths:
      - '.github/workflows/gradient-block-boundary-replication.yml'
  workflow_dispatch:
jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [37, 41, 53]
    env:
      HF_HOME: /tmp/hf
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      SEED: ${{ matrix.seed }}
      TRAIN_TABLES: '10'
      TEST_TABLES: '8'
      TEST_BASE: '40'
      RESULT_PATH: boundary-compression-lab/results/gradient_block_boundary_seed_${{ matrix.seed }}.json
      CKPT_PATH: boundary-compression-lab/results/gradient_block_boundary_seed_${{ matrix.seed }}.pt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: boundary-compression-lab/requirements-bonsai.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -r boundary-compression-lab/requirements-bonsai.txt
      - run: python boundary-compression-lab/experiment_gradient_block_boundary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradient-block-replication-seed-${{ matrix.seed }}
          path: boundary-compression-lab/results/
          if-no-files-found: warn
