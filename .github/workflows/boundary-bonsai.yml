name: boundary-kv-bonsai
on:
  push:
    branches: ['experiment/boundary-kv-bonsai']
    paths:
      - 'boundary-compression-lab/experiment_bonsai.py'
      - 'boundary-compression-lab/requirements-bonsai.txt'
      - '.github/workflows/boundary-bonsai.yml'
  workflow_dispatch:

jobs:
  bonsai:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: /tmp/hf
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install experiment dependencies
        run: python -m pip install -r boundary-compression-lab/requirements-bonsai.txt
      - name: Run Bonsai boundary-cache experiment
        run: python boundary-compression-lab/experiment_bonsai.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundary-bonsai-results
          path: boundary-compression-lab/results/
