name: block-boundary-extrapolate-512
on:
  push:
    branches: ['experiment/boundary-kv-bonsai']
    paths:
      - 'boundary-compression-lab/experiment_block_extrapolate_512.py'
      - '.github/workflows/block-boundary-extrapolate-512.yml'
  workflow_dispatch:
jobs:
  extrapolate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: /tmp/hf
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: boundary-compression-lab/requirements-bonsai.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -r boundary-compression-lab/requirements-bonsai.txt
      - run: python boundary-compression-lab/experiment_block_extrapolate_512.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: block-extrapolate-512-results
          path: boundary-compression-lab/results/
          if-no-files-found: warn
