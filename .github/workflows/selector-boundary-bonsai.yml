name: selector-boundary-bonsai
on:
  push:
    branches: ['experiment/boundary-kv-bonsai']
    paths:
      - 'boundary-compression-lab/experiment_learned_selector.py'
      - 'boundary-compression-lab/requirements-bonsai.txt'
      - '.github/workflows/selector-boundary-bonsai.yml'
  workflow_dispatch:

jobs:
  selector-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: /tmp/hf
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      BOUNDARY_SLOTS: '32'
      RECENT_TOKENS: '48'
      MAX_PREFIX: '192'
      TRAIN_STEPS: '96'
      TRAIN_CASES: '24'
      TEST_CASES: '8'
      BOUNDARY_RANK: '64'
      LR: '0.01'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install dependencies
        run: python -m pip install -r boundary-compression-lab/requirements-bonsai.txt
      - name: Run hard-selector boundary experiment
        run: python boundary-compression-lab/experiment_learned_selector.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selector-boundary-bonsai-results
          path: boundary-compression-lab/results/
